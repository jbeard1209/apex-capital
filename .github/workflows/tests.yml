name: tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wiring-contracts:
    name: wiring-contracts (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # America/New_York = the Mac's local zone (dev host).
          # UTC              = the GCP VM's zone (production host).
          # Both must pass, because "green on the Mac is not green" —
          # see memory host_divergence_is_a_bug_class.
          - tz: America-New_York
            env_tz: America/New_York
          - tz: UTC
            env_tz: UTC
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: institutional-tracker/requirements.txt

      - name: Install requirements
        working-directory: institutional-tracker
        run: |
          python -m pip install --upgrade pip
          # test_pipeline_smoke.py transitively imports the entire firm, so
          # every runtime dep in requirements.txt has to be resolvable — the
          # test class itself only runs static string-matching against
          # producer/consumer routing tables, but Python has to parse the
          # modules first.
          python -m pip install -r requirements.txt

      - name: Run producer/consumer wiring contracts
        working-directory: institutional-tracker
        env:
          TZ: ${{ matrix.env_tz }}
          PYTHONUNBUFFERED: "1"
          # config.py fails loudly at IMPORT if these are unset (by design, after
          # the 2026-07-23 hardcoded-secret incident — see config.py header). On
          # CI there is no .env, so 4 wired agents that import from config
          # (fi_cit_agent, dynamic_position_sizer, ml_improvement_loop,
          # international_analyst) can't be imported, which breaks the
          # test_all_wired_agents_can_be_imported wiring check and 8 downstream
          # tests that transitively import them. TestWiringContracts is static —
          # string matching, AST parsing — it never calls Alpaca or Gmail, so
          # test-only placeholders keep config happy without weakening prod.
          ALPACA_API_KEY: "CI_PLACEHOLDER_NEVER_USED_AT_RUNTIME"
          ALPACA_SECRET_KEY: "CI_PLACEHOLDER_NEVER_USED_AT_RUNTIME"
          GMAIL_APP_PASSWORD: "CI_PLACEHOLDER_NEVER_USED_AT_RUNTIME"
        run: |
          # Same test class the local pre-push gate runs (twice: local + UTC).
          # These 58 tests pin the "silent identifier mismatch" bug class — a
          # producer emitting a rule/pod/category name no consumer handles.
          python -m unittest -v test_pipeline_smoke.TestWiringContracts
