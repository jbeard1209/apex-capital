name: Bug report
description: Something in Apex Capital is producing wrong output, crashing, or drifting silently.
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please give reproducible steps — a bug I can't reproduce is a bug I can't close.

  - type: textarea
    id: description
    attributes:
      label: What went wrong
      description: One paragraph. What did you see, and what did you expect?
      placeholder: |
        e.g. `python3 model_test_harness.py` reports an AUC of 0.98 for the ST model, but the walk-forward number in the last CI run was 0.58.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: The exact commands you ran, in order. If the bug involves a specific file's contents, paste the relevant lines.
      placeholder: |
        1. `cd institutional-tracker`
        2. `python3 model_test_harness.py`
        3. Observe `walk_forward_auc_mean` in `data/model_test_report.json`.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Which host?
      description: |
        Apex runs on the Mac dev host and on a GCP VM (`apex-capital-495523`). They do not sync state; the same bug on both hosts is a different fingerprint than a bug on one.
      options:
        - Mac (local dev)
        - GCP VM (apex-capital-495523)
        - Both
        - Not sure / not host-specific
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.9"
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit SHA
      description: Output of `git rev-parse HEAD`.
      placeholder: "abc1234"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log excerpt
      description: |
        Paste the most relevant ~30-50 lines. Do NOT paste an entire log — I'll ask if I need more. Redact any credentials.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Any suspected root cause, adjacent PRs, or memory-index entries that seem relevant.

  - type: checkboxes
    id: security
    attributes:
      label: Security check
      description: |
        If this bug could let a caller reach the broker without hitting the CRO block, bypass a coherence law, or cross an arm gate, close this issue and email jack.beard07@gmail.com instead — SECURITY.md covers the process.
      options:
        - label: Confirmed this is NOT a security-scope bug.
          required: true
